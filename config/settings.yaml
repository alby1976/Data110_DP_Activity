project:
  name: "Calgary Development Permit Activity"
  course: "DATA 110"
  author: "Albert Leung"

data_source:
  provider: "City of Calgary Open Data"
  dataset_id: "6933-unw5"
  api_base_url: "https://data.calgary.ca/resource"
  format: "json"
  # Maximum records per request; this is not a total download limit.
  page_size: 50000
  # Optional Socrata app token environment variable; do not commit token values.
  app_token_env: "SOCRATA_APP_TOKEN"

  # Use socrata for downloading fresh data.
  # Use csv for reproducible analysis from a frozen snapshot.
  source_type: "socrata"

paths:
  env_file: "config/dp.env"
  raw_data: "data/raw"
  interim_data: "data/interim"
  processed_data: "data/processed"

  classification_rules: "config/classification_rules.csv"

  reports: "reports"
  figures: "reports/figures"
  tables: "reports/tables"

storage:
  # File stem used before the configured output-format extension.
  output_base_name: "development_permits"
  # true replaces existing generated output files; false preserves them.
  overwrite_outputs: true
  # true appends the current UTC date/time to generated output filenames.
  include_timestamp: false
  # strftime format used when include_timestamp is true.
  timestamp_format: "%Y%m%d_%H%M%S"
  # Choose one or more supported formats: csv, json, jgeojson, parquet.
  # Parquet output requires installing the optional project parquet dependencies.
  raw_snapshot_formats:
    - csv
    # - json
    # - jgeojson
    - parquet
  # Excel layout: one_file_per_table or one_workbook (one table per sheet).
  excel_layout: "one_file_per_table"
  processed_output_formats:
    - csv
    # Excel workbook per table; install optional dependencies with pip install ".[excel]".
    # - xlsx
    # - json
    # - jgeojson
    # - parquet

study_periods:
  before:
    label: "Before"
    start: "2022-08-06"
    end: "2024-08-05"

  during:
    label: "During"
    start: "2024-08-06"
    end: "2026-08-03"

  post_repeal:
    label: "Early Post-Repeal"
    start: "2026-08-04"

analysis:
  primary_date_field: "applied_date"

  include_early_post_repeal: true

  processing_time:
    start_field: "applied_date"
    end_field: "decision_date"
    minimum_days: 0

  community_analysis:
    minimum_baseline_count: 5

  classification:
    unmatched_action: "Review"
    case_sensitive: false

seasons:
  fall:
    label: "Fall"
    months: [9, 10, 11]

  winter:
    label: "Winter"
    months: [12, 1, 2]

  spring:
    label: "Spring"
    months: [3, 4, 5]

  summer:
    label: "Summer"
    months: [6, 7, 8]

quality_checks:
  require_unique_permit_number: true

  required_columns:
    - permit_number
    - applied_date
    - category
    - proposed_use_code
    - proposed_use_description
    - land_use_district
    - community

  warn_on_missing_community: true
  warn_on_missing_coordinates: true
  warn_on_negative_processing_days: true
  # Optional quality thresholds (disabled unless supplied).
  # minimum_row_count: 1
  # Freshness uses the latest applied_date and an explicit reference date.
  # For a historical snapshot, choose a reference appropriate to its study window.
  # max_data_age_days: 7
  # reference_date: "2024-08-05"

outputs:
  # Extension-free labels appended to storage.output_base_name.
  # Naming convention:
  # <base>_<label>[_<study_period_label>][_<period>][_<timestamp>][_<current_date_time>].<format>
  # Optional study_period_label comes from study_periods.*.label, made filename-safe.
  # Optional period identifies the analysis period (for example, 2024-08).
  # Add a UTC timestamp only
  # when storage.include_timestamp is true, using storage.timestamp_format.
  # Optional current_date_time is an additional UTC file-generation date/time.
  # Its separate configuration and exporter support are not yet implemented.
  # Formats come from storage.processed_output_formats, not these labels.
  # Example: development_permits_monthly_summary.csv
  # With study label and period: development_permits_monthly_summary_During_2024-08.csv
  clean_permits: "permits_clean"
  monthly_summary: "monthly_summary"
  seasonal_summary: "seasonal_summary"
  community_summary: "community_summary"
  type_summary: "type_summary"
  processing_summary: "processing_summary"
  bias_audit: "bias_audit"

logging:
  level: "INFO"
  log_file: "reports/pipeline.log"
  archive_existing: true
  archive_dir: "reports/logs/archive"
  archive_timestamp_format: "%Y%m%d_%H%M%S"
