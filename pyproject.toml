[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data110-dp-activity"
version = "0.1.0"
description = "Calgary development permit activity analysis for a DATA 110 mini-capstone project."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Albert Leung" },
]
keywords = [
    "calgary",
    "data-analysis",
    "development-permits",
    "power-bi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas==2.2.3",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "sodapy==2.2.0",
]

[project.urls]
Homepage = "https://github.com/alby1976/Data110_DP_Activity"
Repository = "https://github.com/alby1976/Data110_DP_Activity"
Documentation = "https://github.com/alby1976/Data110_DP_Activity#readme"
Issues = "https://github.com/alby1976/Data110_DP_Activity/issues"
Data = "https://data.calgary.ca/Business-and-Economic-Activity/Development-Permits/6933-unw5"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "requests-mock==1.12.1",
]
parquet = [
    "pyarrow==25.0.1",
]

[project.scripts]
dp-activity = "dp_activity.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dp_activity*"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
