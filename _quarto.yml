project:
  type: default
  render:
    - notebooks/03_ten_minute_presentation.ipynb
  output-dir: reports/presentation

title: "Calgary Development Permit Before and During Blanket Rezoning"
subtitle: "An observational comparison"
author: "Albert Leung · DATA 110"
date: "2026-10-13"
date-format: "MMMM D, YYYY"

format:
